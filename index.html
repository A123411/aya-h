<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة حفل الحناء المنتظر</title>
    
    <!-- مكتبة الأنيميشن المشهورة Animate.css ومكتبة الخطوط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0c1b; /* خلفية داكنة فخمة تبرز الصور والتأثيرات */
            --gold-color: #d4af37;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* حاوية الموقع الأساسية */
        .main-wrapper {
            max-width: 600px; /* لضمان مظهر ممتاز ومثالي على الموبايلات */
            margin: 0 auto;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        /* الخطوط الفنية الفاصلة والزخارف */
        .art-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px auto;
            width: 80%;
            opacity: 0.8;
        }
        .art-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
        }
        .art-diamond {
            width: 10px;
            height: 10px;
            background-color: var(--gold-color);
            transform: rotate(45deg);
            margin: 0 15px;
            box-shadow: 0 0 10px var(--gold-color);
        }

        /* كروت الميديا مع تأثيرات الظل والأنيميشن عند التمرير */
        .media-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.15);
        }

        .media-card img, .media-card video {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        /* تصميم العداد التنازلي الشيك */
        .countdown-section {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(15, 12, 27, 0.8));
            border: 2px solid var(--gold-color);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            margin: 40px 0;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .countdown-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.5rem;
            color: var(--gold-color);
            margin-bottom: 25px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .countdown-container {
            display: flex;
            justify-content: space-around;
            direction: ltr; /* لترتيب الأرقام من اليسار لليمين صح */
        }

        .time-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            min-width: 70px;
            border-bottom: 3px solid var(--gold-color);
        }

        .time-number {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            display: block;
        }

        .time-label {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 5px;
            display: block;
            font-family: 'Cairo', sans-serif;
        }

        /* لمسة تأثيرات خلفية ناعمة تحسسك بالفرحة */
        .sparkle-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 75% 60%, rgba(212, 175, 55, 0.08) 2px, transparent 2px);
            background-size: 100px 100px;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="sparkle-bg"></div>

    <div class="main-wrapper">

        <!-- الجزء الأول: الصورة الأولى الافتتاحية -->
        <div class="media-card animate__animated animate__fadeInDown">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (1).jpeg" alt="دعوة الحنة - البداية">
        </div>

        <!-- فاصل فني خطوط وزخرفة -->
        <div class="art-divider animate__animated animate__fadeIn animate__delay-1s">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <!-- الجزء الثاني: العداد التنازلي المنتظر -->
        <div class="countdown-section animate__animated animate__jackInTheBox animate__delay-1s">
            <div class="countdown-title">مستنيين الفرحة.. باقي على الليلة المنتظرة:</div>
            <div class="countdown-container" id="countdown">
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">ثانية</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">يوم</span>
                </div>
            </div>
        </div>

        <!-- فاصل فني خطوط وزخرفة -->
        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <!-- الجزء الثالث: الفيديو (يشتغل بالضغط عليه بالصوت) -->
        <div class="media-card animate__animated animate__fadeInUp">
            <!-- أضفنا كود controls عشان يظهر زر التشغيل والصوت بوضوح -->
            <video id="weddingVideo" controls poster="WhatsApp Image 1447-12-23 at 21.08.19.jpeg">
                <source src="WhatsApp Video 1447-12-23 at 21.08.23.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <!-- فاصل فني خطوط وزخرفة -->
        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <!-- الجزء الرابع: الصورة الثالثة والختام -->
        <div class="media-card animate__animated animate__fadeInUp">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19.jpeg" alt="دعوة الحنة - التفاصيل والختام">
        </div>

    </div>

    <!-- كود الجافا سكريبت لتشغيل العداد التنازلي بدقة ليوم 25 أغسطس -->
    <script>
        // تحديد تاريخ الهدف: 25 أغسطس
        const targetDate = new Date("August 25, 2026 20:00:00").getTime();

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // حسابات الأيام، الساعات، الدقائق، والثواني
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // عرض النتائج في الصفحة
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // إذا انتهى الوقت
            if (difference < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-title").innerText = "اليوم هو يوم الفرحة المنشودة! 🎉";
                document.getElementById("countdown").style.display = "none";
            }
        }, 1000);
    </script>
</body>
</html>
