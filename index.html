<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حنة آية - الدعوة الملكية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- استدعاء أجدد وأفخم الخطوط المتناسقة للدعوات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi+Fun:wght@500;700&family=Amiri:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-light: #fdf3e7;
            --main-gold: #c59b27;
            --premium-bronze: #5c3a21;
            --glow-color: rgba(197, 155, 39, 0.35);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--premium-bronze);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .main-wrapper {
            width: 100%;
            max-width: 460px; 
            margin: 0 auto;
            padding: 0; 
            box-sizing: border-box;
            position: relative;
            background: linear-gradient(180deg, #fbf2e3 0%, #ebdccb 50%, #fdf3e7 100%);
            box-shadow: 0 0 40px rgba(43, 23, 12, 0.15);
        }

        .first-hero {
            width: 100%;
            line-height: 0;
            display: block;
        }

        .first-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 👑 قسم العداد التنازلي الملكي المطور (توهج فاجر) */
        .countdown-section {
            padding: 35px 20px;
            text-align: center;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            margin: 25px 15px;
            border: 1px solid rgba(197, 155, 39, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(92, 58, 33, 0.05);
        }

        .countdown-title {
            font-family: 'Reem Kufi Fun', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--premium-bronze);
            margin-bottom: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .countdown-subtitle {
            font-size: 0.85rem;
            color: var(--main-gold);
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .countdown-grid {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            direction: ltr; 
        }

        /* تضبيط شكل كروت الوقت الدائرية الفخمة بالتوهج والظلال */
        .time-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 82px;
            height: 82px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%; 
            border: 1.5px solid rgba(197, 155, 39, 0.3);
            /* بهارات التوهج الذهبي حول العداد */
            box-shadow: 0 0 15px var(--glow-color), inset 0 0 8px rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .time-number {
            font-family: 'Cairo', sans-serif;
            font-size: 1.75rem;
            font-weight: 900;
            color: var(--premium-bronze);
            line-height: 1;
        }

        .time-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #8c6347;
            margin-top: 3px;
        }

        /* 💃 قسم الرقصة الفخم والزخارف الفاجرة */
        .dance-wrapper {
            margin: 35px 0 15px 0;
            text-align: center;
            position: relative;
        }

        .dance-header h3 {
            font-family: 'Reem Kufi Fun', sans-serif;
            font-size: 1.8rem;
            color: var(--premium-bronze);
            margin: 0 0 10px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* إضافة لمسة زخرفية ذهبية حول عنوان الرقصة */
        .dance-header h3::before, .dance-header h3::after {
            content: '✦';
            color: var(--main-gold);
            font-size: 1.2rem;
            text-shadow: 0 0 8px var(--glow-color);
        }

        .dance-header .poem-line {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            color: var(--main-gold);
            margin: 0;
            font-style: italic;
            line-height: 1.4;
            font-weight: 600;
        }

        /* حاوية التبديل الفوري الموسطة مع التوهج السينمائي */
        .photo-animation-container {
            width: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            margin: 25px 0;
            line-height: 0;
            justify-items: center;
            align-items: center;
            background: radial-gradient(circle, rgba(197,155,39,0.18) 0%, transparent 65%);
        }
        
        .anim-slide {
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: auto;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            filter: drop-shadow(0 10px 20px rgba(92, 58, 33, 0.12));
        }
        
        .anim-slide.active {
            display: block;
            opacity: 1;
            z-index: 2;
        }

        /* كروت الميديا الأصلية */
        .media-card {
            width: 100%;
            display: block;
            line-height: 0;
            margin-top: 20px;
        }

        .media-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 📜 تذييل فخم ومنسق للكلام اللي في الآخر */
        .footer-poem {
            font-family: 'Reem Kufi Fun', sans-serif;
            text-align: center;
            font-size: 1.35rem;
            line-height: 1.8;
            padding: 50px 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(92, 58, 33, 0.08) 100%);
            margin: 0;
            color: var(--premium-bronze);
            font-weight: 700;
        }

        .premium-divider {
            text-align: center;
            padding: 10px 0;
            color: var(--main-gold);
            font-size: 1.2rem;
            opacity: 0.6;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <!-- هيرو البداية الملكي -->
        <div class="first-hero">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (1) (1).jpeg" alt="حنة آية الجزء الأول">
        </div>

        <!-- 👑 العداد التنازلي بالتصميم المطور والتوهج الفاجر -->
        <div class="countdown-section">
            <div class="countdown-title">تَبَــقَّى عَلَى لَـيْلَةِ العُـمْر</div>
            <div class="countdown-subtitle">شاركونا تفاصيل الفرحة والبهجة</div>
            
            <div class="countdown-grid" id="countdown">
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">ثانية</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">يوم</span>
                </div>
            </div>
        </div>

        <div class="premium-divider">✨ ✦ 👑 ✦ ✨</div>

        <!-- 💃 قسم الرقصة والزخارف المظبوطة مع الكلام الجامد -->
        <div class="dance-wrapper">
            <div class="dance-header">
                <h3>فرحة العروس.. الرقصة الأولى</h3>
                <p class="poem-line">يا قمر ضوّي عليها.. ليلة الحنّة بين إيديها ✨</p>
            </div>

            <!-- حاوية التبديل الفوري الموسطة تماماً بتأثير الإضاءة الخلفية -->
            <div class="photo-animation-container">
                <img class="anim-slide active" src="WhatsApp_Image_1447-12-23_at_22.14.14__1___1___1_-removebg-preview.png" alt="حركة 1">
                <img class="anim-slide" src="WhatsApp_Image_1447-12-23_at_22.14.14__2___1_-removebg-preview (1).png" alt="حركة 2">
            </div>
        </div>

        <div class="premium-divider">✨ ✦ 👑 ✦ ✨</div>

        <!-- كارت الصورة الأخير (الأصلي بتاعك) -->
        <div class="media-card">
            <img src="WhatsApp_Image_1447-12-23_at_21.08.19__2___1_-removebg-preview.png" alt="حنة آية الجزء الأخير">
        </div>

        <!-- 📜 الكلام اللي في الآخر متقفل بشكل شيك جداً بالخط الفاجر -->
        <div class="footer-poem">
            حضوركم يكتمل به فرحنا وسرورنا.. <br>
            ودامت دياركم بالمسرات والأفراح المبهجة دائماً 🎉
        </div>

    </div>

    <script>
        // العداد التنازلي التلقائي الذكي لـ 25 أغسطس 2026
        const targetDate = new Date("August 25, 2026 20:00:00").getTime();
        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-title").innerText = "بدأت الفرحة المنتظرة الآن! 🎉";
                document.getElementById("countdown").style.display = "none";
            }
        }, 1000);

        // تبديل تلقائي ناعم للرقصة
        const slides = document.querySelectorAll('.anim-slide');
        let currentSlide = 0;
        setInterval(() => {
            if(slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }, 1100);
    </script>
</body>
</html>
