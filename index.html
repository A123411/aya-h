<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة حفل الحناء</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* لون الخلفية الموحد المطابق للصور تماماً */
            --bg-color: #dfcfbf; 
            --text-color: #563321; 
            --card-bg: rgba(255, 255, 255, 0.25);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .main-wrapper {
            width: 100%;
            max-width: 450px; 
            margin: 0 auto;
            padding: 0; 
            box-sizing: border-box;
        }

        /* فواصل ناعمة وبسيطة جداً غير مزعجة */
        .simple-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-color), transparent);
            margin: 25px auto;
            width: 60%;
            opacity: 0.3;
        }

        .media-card {
            background: transparent;
            border: none;
            margin: 0;
            padding: 0;
            width: 100%;
            display: block;
        }

        .media-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* كدر ثابت تماماً للأنيميشن بدون أي حركة يمين أو شمال */
        .photo-animation-container {
            width: 100%;
            position: relative;
            background-color: var(--bg-color);
            display: grid;
            grid-template-columns: 1fr;
        }
        
        .anim-slide {
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease-in-out; /* تبديل ناعم في نفس المكان */
        }
        
        .anim-slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* تصميم عداد تنازلي هادئ وراقٍ */
        .countdown-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .countdown-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            direction: ltr; 
        }

        .time-box {
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 5px;
            border-radius: 8px;
            border: 1px solid rgba(86, 51, 33, 0.1);
        }

        .time-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            display: block;
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-color);
            opacity: 0.8;
            margin-top: 2px;
            display: block;
        }

        /* تصميم زر موقع القاعة الراقي البسيط */
        .location-section {
            text-align: center;
            margin: 25px;
        }

        .location-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--text-color);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(86, 51, 33, 0.15);
            transition: background-color 0.3s ease;
        }

        .location-btn:hover {
            background-color: #3d2316;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <div class="media-card">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (1) (1).jpeg" alt="دعوة الحنة 1">
        </div>

        <div class="simple-divider"></div>

        <div class="countdown-section">
            <div class="countdown-title">الوقت المتبقي على ليلتنا المنتظرة</div>
            <div class="countdown-grid" id="countdown">
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">ثانية</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">يوم</span>
                </div>
            </div>
        </div>

        <div class="simple-divider"></div>

        <div class="photo-animation-container">
            <img src="WhatsApp Image 1447-12-23 at 22.14.14 (1) (1).jpeg" class="anim-slide active" alt="حركة 1">
            <img src="WhatsApp Image 1447-12-23 at 22.14.14 (2).jpeg" class="anim-slide" alt="حركة 2">
        </div>

        <div class="simple-divider"></div>

        <div class="location-section">
            <a href="#" target="_blank" class="location-btn">
                <i class="fa-solid fa-location-dot"></i> موقع حفل الحناء على الخريطة
            </a>
        </div>

        <div class="simple-divider"></div>

        <div class="media-card">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (2).jpeg" alt="دعوة الحنة 3">
        </div>

    </div>

    <script>
        // العداد التنازلي إلى 25 أغسطس 2026
        const targetDate = new Date("August 25, 2026 20:00:00").getTime();
        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-title").innerText = "بدأ الحفل الآن! 🎉";
                document.getElementById("countdown").style.display = "none";
            }
        }, 1000);

        // التبديل في كدر ثابت تماماً بدون أي اهتزاز
        const slides = document.querySelectorAll('.anim-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 1200); // سرعة تبديل هادية ومريحة للعين
    </script>
</body>
</html>
