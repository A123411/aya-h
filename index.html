<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حنة آية - الدعوة الملكية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f0dfcc; 
            --main-brown: #563321; 
            --gold-accent: #b8860b;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(86, 51, 33, 0.08);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--main-brown);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .main-wrapper {
            width: 100%;
            max-width: 460px; 
            margin: 0 auto;
            padding: 0; 
            box-sizing: border-box;
            background-color: var(--bg-color);
            position: relative;
        }

        /* تعديل 1: الصورة الأولى ملتصقة تماماً بأعلى الشاشة */
        .first-hero {
            width: 100%;
            margin: 0;
            padding: 0;
            line-height: 0;
            display: block;
        }

        .first-hero img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
        }

        /* كروت الميديا الانسيابية مدمجة الحواف */
        .media-card {
            background: transparent;
            border: none;
            margin: 0;
            padding: 0;
            width: 100%;
            display: block;
            line-height: 0;
        }

        .media-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* حاوية التبديل الفوري في كدر ثابت مدمج */
        .photo-animation-container {
            width: 100%;
            position: relative;
            background-color: var(--bg-color);
            display: grid;
            grid-template-columns: 1fr;
            margin: 0;
            padding: 0;
            line-height: 0;
        }
        
        .anim-slide {
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: auto;
            display: none;
        }
        
        .anim-slide.active {
            display: block;
            z-index: 2;
        }

        /* تأثير الأنيميشن والغطاء الحركي لدمج الفواصل */
        .wave-separator {
            width: 100%;
            line-height: 0;
            position: relative;
            background-color: var(--bg-color);
            margin: -1px 0; /* لمنع ظهور فراغات البكسل */
        }

        .wave-separator svg {
            position: relative;
            display: block;
            width: 100%;
            height: 40px;
        }

        .wave-path {
            fill: #ebdccb; /* درجة لونية متناغمة ممزوجة تخفي عيوب أطراف الصور */
            animation: waveMove 4s ease-in-out infinite alternate;
        }

        @keyframes waveMove {
            0% { d: path("M0,15 C150,30 300,0 460,15 L460,40 L0,40 Z"); }
            100% { d: path("M0,25 C120,5 280,35 460,20 L460,40 L0,40 Z"); }
        }

        /* العداد التنازلي الدائري المودرن الفخم */
        .countdown-section {
            background: linear-gradient(180deg, #ebdccb, var(--bg-color));
            padding: 30px 15px;
            text-align: center;
            margin: 0;
            position: relative;
        }

        .countdown-title {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--main-brown);
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .countdown-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
            direction: ltr; 
        }

        .time-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 78px;
            height: 78px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; 
            border: 1px solid rgba(86, 51, 33, 0.05);
            box-shadow: 0 4px 12px rgba(86, 51, 33, 0.03);
        }

        .time-number {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--main-brown);
            line-height: 1;
        }

        .time-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--main-brown);
            opacity: 0.8;
            margin-top: 4px;
        }

        /* قسم موقع الخريطة الانسيابي */
        .location-section {
            text-align: center;
            margin: 0;
            padding: 35px 20px;
            background: linear-gradient(180deg, var(--bg-color), #ebdccb);
        }

        .location-title {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .location-desc {
            font-size: 0.88rem;
            opacity: 0.85;
            margin-bottom: 22px;
            padding: 0 15px;
            line-height: 1.6;
        }

        .location-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--main-brown);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 6px 20px rgba(86, 51, 33, 0.15);
            transition: all 0.3s ease;
        }

        .location-btn:hover {
            background-color: #3d2316;
            transform: scale(1.02);
        }

        .footer-poem {
            font-family: 'Amiri', serif;
            text-align: center;
            font-size: 1.4rem;
            line-height: 1.7;
            padding: 40px 0;
            background-color: #ebdccb;
            margin: 0;
            color: var(--main-brown);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <div class="first-hero">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (1) (1).jpeg" alt="حنة آية الجزء الأول">
        </div>

        <div class="wave-separator">
            <svg viewBox="0 0 460 40" preserveAspectRatio="none">
                <path class="wave-path" d="M0,15 C150,30 300,0 460,15 L460,40 L0,40 Z"></path>
            </svg>
        </div>

        <div class="countdown-section">
            <div class="countdown-title">الوقت المتبقي على الليلة المنتظرة</div>
            <div class="countdown-grid" id="countdown">
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">ثانية</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">يوم</span>
                </div>
            </div>
        </div>

        <div class="wave-separator" style="transform: scaleY(-1);">
            <svg viewBox="0 0 460 40" preserveAspectRatio="none">
                <path class="wave-path" d="M0,15 C150,30 300,0 460,15 L460,40 L0,40 Z"></path>
            </svg>
        </div>

        <div class="photo-animation-container">
            <img src="WhatsApp_Image_1447-12-23_at_22.14.14__1___1___1_-removebg-preview.png" alt="حركة 1">
            <img src="WhatsApp_Image_1447-12-23_at_22.14.14__2___1_-removebg-preview (1).png" alt="حركة 2">
        </div>

        <div class="wave-separator">
            <svg viewBox="0 0 460 40" preserveAspectRatio="none">
                <path class="wave-path" d="M0,15 C150,30 300,0 460,15 L460,40 L0,40 Z"></path>
            </svg>
        </div>

        <div class="location-section">
            <div class="location-title"><i class="fa-solid fa-map-location-dot" style="color: var(--gold-accent);"></i> موقع ومكان الحفل</div>
            <div class="location-desc">يسعدنا حضوركم وتشريفكم لنا، اضغط على الزر أدناه لتوجيهك إلى موقع القاعة مباشرة على الخرائط.</div>
            <a href="#" target="_blank" class="location-btn">
                <i class="fa-solid fa-location-arrow"></i> فتح الاتجاهات على الخريطة
            </a>
        </div>

        <div class="media-card">
            <img src="WhatsApp_Image_1447-12-23_at_21.08.19__2___1_-removebg-preview.png" alt="حنة آية الجزء الأخير">
        </div>

        <div class="footer-poem">
            حضوركم يكتمل به فرحنا وسرورنا.. <br>
            وعاقبة المسرات لكم دائمًا دامت دياركم بالأفراح 🎉
        </div>

    </div>

    <script>
        // العداد التنازلي التلقائي الذكي لـ 25 أغسطس 2026
        const targetDate = new Date("August 25, 2026 20:00:00").getTime();
        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-title").innerText = "بدأت الفرحة المنتظرة الآن! 🎉";
                document.getElementById("countdown").style.display = "none";
            }
        }, 1000);

        // تبديل فوري "قطع فوري" للصور في كدر ثابت تماماً ومحاذاة تامة
        const slides = document.querySelectorAll('.anim-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 1000);
    </script>
</body>
</html>
