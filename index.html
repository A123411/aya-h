<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة حفل الحناء المنتظر</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* درجة بيج موحدة ومدروسة عشان تدمج كل الصور */
            --bg-color: #dfcfbf; 
            --gold-color: #563321; 
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px; 
            margin: 0 auto;
            padding: 0px; 
            box-sizing: border-box;
            background-color: var(--bg-color);
            position: relative;
            z-index: 2;
        }

        .art-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px auto;
            width: 80%;
        }
        .art-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
        }
        .art-diamond {
            width: 8px;
            height: 8px;
            background-color: var(--gold-color);
            transform: rotate(45deg);
            margin: 0 10px;
        }

        .media-card {
            background: transparent;
            border: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .media-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* حاوية الأنيميشن لمنع أي أزرار أو تحكم تماماً */
        .video-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .countdown-section {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--gold-color);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            margin: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .countdown-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold-color);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            direction: ltr; 
        }

        .time-box {
            background: var(--gold-color);
            padding: 10px 5px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .time-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            display: block;
            line-height: 1.2;
        }

        .time-label {
            font-size: 0.75rem;
            color: #e0e0e0;
            margin-top: 4px;
            display: block;
        }

        /* أنيميشن تساقط القصاصات والسباركلز في الخلفية */
        #particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--gold-color);
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="particle-container"></div>

    <div class="main-wrapper">

        <div class="media-card animate__animated animate__fadeIn">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (1).jpeg" alt="دعوة الحنة">
        </div>

        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <div class="countdown-section animate__animated animate__zoomIn">
            <div class="countdown-title">مستنيين الفرحة.. باقي على الليلة المنتظرة:</div>
            <div class="countdown-grid" id="countdown">
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">ثانية</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">يوم</span>
                </div>
            </div>
        </div>

        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <div class="media-card video-container animate__animated animate__fadeIn">
            <video id="weddingVideo" autoplay loop muted playsinline webkit-playsinline aria-hidden="true">
                <source src="WhatsApp Image 1447-12-23 at 21.08.19 (2).jpeg" type="video/mp4">
            </video>
        </div>

        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <div class="media-card animate__animated animate__fadeIn">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19.jpeg" alt="دعوة الحنة">
        </div>

    </div>

    <script>
        const targetDate = new Date("August 25, 2026 20:00:00").getTime();

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-title").innerText = "اليوم هو يوم الفرحة المنشودة! 🎉";
                document.getElementById("countdown").style.display = "none";
            }
        }, 1000);

        // إنشاء جزيئات الفرحة المتساقطة ديناميكياً
        function createParticles() {
            const container = document.getElementById('particle-container');
            const particleCount = 40;
            const colors = ['#563321', '#ffffff', '#d4af37', '#b8860b'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // تنويع الأشكال بين دوائر ومربعات صغيرة
                if (Math.random() > 0.5) {
                    particle.style.borderRadius = '0%';
                }
                
                const size = (Math.random() * 6 + 4) + 'px';
                particle.style.width = size;
                particle.style.height = size;

                container.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
