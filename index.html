<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة حفل الحناء المنتظر</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0c1b; 
            --gold-color: #d4af37;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px; 
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }

        .art-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            width: 80%;
        }
        .art-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
        }
        .art-diamond {
            width: 8px;
            height: 8px;
            background-color: var(--gold-color);
            transform: rotate(45deg);
            margin: 0 10px;
            box-shadow: 0 0 8px var(--gold-color);
        }

        .media-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .media-card img, .media-card video {
            width: 100%;
            height: auto;
            display: block;
        }

        .countdown-section {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(15, 12, 27, 0.9));
            border: 1px solid var(--gold-color);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            margin: 30px 0;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .countdown-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold-color);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            direction: ltr; 
        }

        .time-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 5px;
            border-radius: 8px;
            border-bottom: 2px solid var(--gold-color);
            box-sizing: border-box;
        }

        .time-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            display: block;
            line-height: 1.2;
        }

        .time-label {
            font-size: 0.75rem;
            color: #b3b3b3;
            margin-top: 4px;
            display: block;
            font-family: 'Cairo', sans-serif;
        }

        .sparkle-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 75% 60%, rgba(212, 175, 55, 0.04) 2px, transparent 2px);
            background-size: 80px 80px;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="sparkle-bg"></div>

    <div class="main-wrapper">

        <div class="media-card animate__animated animate__fadeInDown">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19 (1).jpeg" alt="دعوة الحنة">
        </div>

        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <div class="countdown-section animate__animated animate__zoomIn">
            <div class="countdown-title">مستنيين الفرحة.. باقي على الليلة المنتظرة:</div>
            <div class="countdown-grid" id="countdown">
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">ثانية</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">يوم</span>
                </div>
            </div>
        </div>

        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <div class="media-card animate__animated animate__fadeInUp">
            <video id="weddingVideo" autoplay loop muted playsinline controls>
                <source src="WhatsApp Video 1447-12-23 at 21.08.23.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <div class="art-divider">
            <div class="art-line"></div>
            <div class="art-diamond"></div>
            <div class="art-line"></div>
        </div>

        <div class="media-card animate__animated animate__fadeInUp">
            <img src="WhatsApp Image 1447-12-23 at 21.08.19.jpeg" alt="دعوة الحنة">
        </div>

    </div>

    <script>
        const targetDate = new Date("August 25, 2026 20:00:00").getTime();

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-title").innerText = "اليوم هو يوم الفرحة المنشودة! 🎉";
                document.getElementById("countdown").style.display = "none";
            }
        }, 1000);
    </script>
</body>
</html>
